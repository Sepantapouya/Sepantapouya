<style>.travel{animation:travel 6s cubic-bezier(.65,0,.35,1) infinite}
@keyframes travel{0%,8%{transform:translateX(0)}25%,33%{transform:translateX(304.0px)}50%,58%{transform:translateX(608.0px)}75%,92%{transform:translateX(912px)}100%{transform:translateX(0)}}</style><line x1="144.0" x2="1056.0" y1="64" y2="64" stroke="#2C3540"/><circle class="travel" cx="144.0" cy="64" r="4" fill="#D2145A"/><rect x="0.5" y="96.5" width="287" height="180" rx="18" fill="#11151A" stroke="#222A33"/><g transform="translate(122.0 42)"><g class=""><rect x="0" y="0" width="44" height="44" rx="6" fill="#161B22" stroke="#222A33"/><g transform="rotate(0 22.0 22.0)"><path d="M3 3 L41 3 A38 38 0 0 1 3 41 Z" fill="#D2145A"/></g></g></g><text x="24" y="136" class="mono" font-size="12" fill="#F2457F">01</text><text x="24" y="166" class="sans" font-size="21" font-weight="650" letter-spacing="-.5" fill="#F2F4F7">Understand</text><text x="24" y="198" class="sans" font-size="14.5" fill="#8B95A3">Research, interviews and data to</text><text x="24" y="220" class="sans" font-size="14.5" fill="#8B95A3">find the real problem — not the</text><text x="24" y="242" class="sans" font-size="14.5" fill="#8B95A3">loudest one.</text><rect x="304.5" y="96.5" width="287" height="180" rx="18" fill="#11151A" stroke="#222A33"/><g transform="translate(426.0 42)"><g class=""><rect x="0" y="0" width="44" height="44" rx="6" fill="#161B22" stroke="#222A33"/><g transform="rotate(0 22.0 22.0)"><path d="M3 22.0 A19.0 19.0 0 0 1 41 22.0 Z" fill="#F59AB9"/></g></g></g><text x="328" y="136" class="mono" font-size="12" fill="#F2457F">02</text><text x="328" y="166" class="sans" font-size="21" font-weight="650" letter-spacing="-.5" fill="#F2F4F7">Frame</text><text x="328" y="198" class="sans" font-size="14.5" fill="#8B95A3">Flows, IA and a sharp problem</text><text x="328" y="220" class="sans" font-size="14.5" fill="#8B95A3">statement the whole team agrees</text><text x="328" y="242" class="sans" font-size="14.5" fill="#8B95A3">on.</text><rect x="608.5" y="96.5" width="287" height="180" rx="18" fill="#11151A" stroke="#222A33"/><g transform="translate(730.0 42)"><g class=""><rect x="0" y="0" width="44" height="44" rx="6" fill="#161B22" stroke="#222A33"/><g transform="rotate(0 22.0 22.0)"><circle cx="22.0" cy="22.0" r="14.0" fill="#F59AB9"/></g></g></g><text x="632" y="136" class="mono" font-size="12" fill="#F2457F">03</text><text x="632" y="166" class="sans" font-size="21" font-weight="650" letter-spacing="-.5" fill="#F2F4F7">Design</text><text x="632" y="198" class="sans" font-size="14.5" fill="#8B95A3">Prototypes tested with real users,</text><text x="632" y="220" class="sans" font-size="14.5" fill="#8B95A3">built on a solid design system.</text><rect x="912.5" y="96.5" width="287" height="180" rx="18" fill="#11151A" stroke="#222A33"/><g transform="translate(1034.0 42)"><g class=""><rect x="0" y="0" width="44" height="44" rx="6" fill="#161B22" stroke="#222A33"/><g transform="rotate(90 22.0 22.0)"><path d="M3 3 L41 3 L3 41 Z" fill="#D2145A"/></g></g></g><text x="936" y="136" class="mono" font-size="12" fill="#F2457F">04</text><text x="936" y="166" class="sans" font-size="21" font-weight="650" letter-spacing="-.5" fill="#F2F4F7">Ship</text><text x="936" y="198" class="sans" font-size="14.5" fill="#8B95A3">Specs, tokens — often the code</text><text x="936" y="220" class="sans" font-size="14.5" fill="#8B95A3">itself. Then measure and iterate.</text>
</svg>
