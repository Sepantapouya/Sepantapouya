<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="How I work: Understand, Frame, Design, Ship">
<title>How I work: Understand, Frame, Design, Ship</title>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
