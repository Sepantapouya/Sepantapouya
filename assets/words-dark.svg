<rect x="0.5" y=".5" width="383" height="339" rx="20" fill="#11151A" stroke="#222A33"/><text x="30" y="76" class="sans" font-size="64" font-weight="700" fill="#D2145A">“</text><text x="30" y="104" class="sans" font-size="16.5" fill="#F2F4F7">He quickly and effectively identifies user</text><text x="30" y="130" class="sans" font-size="16.5" fill="#F2F4F7">needs and pain points — highly motivated,</text><text x="30" y="156" class="sans" font-size="16.5" fill="#F2F4F7">results-oriented, and an excellent team</text><text x="30" y="182" class="sans" font-size="16.5" fill="#F2F4F7">member.</text><line x1="30" x2="354" y1="254" y2="254" stroke="#222A33"/><circle cx="50" cy="296" r="20" fill="#161B22" stroke="#2C3540"/><text x="50" y="300.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#8B95A3">FG</text><text x="82" y="291" class="sans" font-size="15" font-weight="600" fill="#F2F4F7">Fatemeh Golivari</text><text x="82" y="311" class="sans" font-size="12.5" fill="#8B95A3">Product Designer</text><rect x="408.5" y=".5" width="383" height="339" rx="20" fill="#11151A" stroke="#222A33"/><text x="438" y="76" class="sans" font-size="64" font-weight="700" fill="#D2145A">“</text><text x="438" y="104" class="sans" font-size="16.5" fill="#F2F4F7">An excellent communicator and</text><text x="438" y="130" class="sans" font-size="16.5" fill="#F2F4F7">collaborator who always strives to</text><text x="438" y="156" class="sans" font-size="16.5" fill="#F2F4F7">understand stakeholders&#x27; goals — and</text><text x="438" y="182" class="sans" font-size="16.5" fill="#F2F4F7">delivers solutions that exceed</text><text x="438" y="208" class="sans" font-size="16.5" fill="#F2F4F7">expectations.</text><line x1="438" x2="762" y1="254" y2="254" stroke="#222A33"/><circle cx="458" cy="296" r="20" fill="#161B22" stroke="#2C3540"/><text x="458" y="300.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#8B95A3">TS</text><text x="490" y="291" class="sans" font-size="15" font-weight="600" fill="#F2F4F7">Tigran Safaryan</text><text x="490" y="311" class="sans" font-size="12.5" fill="#8B95A3">Senior Product Owner &amp; AI Product Leader</text><rect x="816.5" y=".5" width="383" height="339" rx="20" fill="#11151A" stroke="#222A33"/><text x="846" y="76" class="sans" font-size="64" font-weight="700" fill="#D2145A">“</text><text x="846" y="104" class="sans" font-size="16.5" fill="#F2F4F7">Highly creative and an excellent problem</text><text x="846" y="130" class="sans" font-size="16.5" fill="#F2F4F7">solver. He sets very high standards for</text><text x="846" y="156" class="sans" font-size="16.5" fill="#F2F4F7">himself, and his design quality is</text><text x="846" y="182" class="sans" font-size="16.5" fill="#F2F4F7">unparalleled.</text><line x1="846" x2="1170" y1="254" y2="254" stroke="#222A33"/><circle cx="866" cy="296" r="20" fill="#161B22" stroke="#2C3540"/><text x="866" y="300.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#8B95A3">SM</text><text x="898" y="291" class="sans" font-size="15" font-weight="600" fill="#F2F4F7">Seyed Mohammad Keramati</text><text x="898" y="311" class="sans" font-size="12.5" fill="#8B95A3">Ex-PM @ Partnerz, Tapsi &amp; Cafebazaar</text>
