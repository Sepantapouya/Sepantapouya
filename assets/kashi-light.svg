</style>
<defs><radialGradient id="kg" cx="85%" cy="0%" r="70%"><stop offset="0" stop-color="#D2145A" stop-opacity="0.091"/><stop offset="1" stop-color="#D2145A" stop-opacity="0"/></radialGradient></defs>
