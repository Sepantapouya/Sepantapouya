<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Kashi — open-source Persian design system. 42 stars, 72288 npm installs a month">
<title>Kashi — open-source Persian design system. 42 stars, 72288 npm installs a month</title>
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif} .mono{font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
