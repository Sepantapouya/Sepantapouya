<line x1="56" x2="640" y1="286" y2="286" stroke="#E4E7EC"/>
<text x="56" y="328" class="sans" font-size="26" font-weight="650" letter-spacing="-.8" fill="#0B0D10">★ 42</text><text x="56" y="350" class="sans" font-size="12.5" fill="#5B6472">stars</text><text x="196" y="328" class="sans" font-size="26" font-weight="650" letter-spacing="-.8" fill="#0B0D10">72.3k</text><text x="196" y="350" class="sans" font-size="12.5" fill="#5B6472">npm / month</text><text x="336" y="328" class="sans" font-size="26" font-weight="650" letter-spacing="-.8" fill="#0B0D10">60+</text><text x="336" y="350" class="sans" font-size="12.5" fill="#5B6472">components</text><text x="476" y="328" class="sans" font-size="26" font-weight="650" letter-spacing="-.8" fill="#0B0D10">13k</text><text x="476" y="350" class="sans" font-size="12.5" fill="#5B6472">icons</text>

  <!-- miniature UI built from Kashi parts, set right-to-left -->
