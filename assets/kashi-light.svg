<rect x="1" y="1" width="1198" height="398" rx="23" fill="url(#kg)"/>
<g transform="translate(56 56)"><g class=""><rect x="0" y="0" width="44" height="44" rx="6" fill="#F1F3F6" stroke="#E4E7EC"/><g transform="rotate(0 22.0 22.0)"><path d="M3 3 L41 3 A38 38 0 0 1 3 41 Z" fill="#D2145A"/></g></g></g>
<text x="116" y="78" class="sans" font-size="26" font-weight="700" letter-spacing="-.6" fill="#0B0D10">Kashi <tspan fill="#5B6472" font-weight="500">کاشی</tspan></text>
<text x="116" y="100" class="mono" font-size="12.5" fill="#D2145A">FEATURED · OPEN SOURCE · MIT</text>
<text x="56" y="152" class="sans" font-size="19" font-weight="500" fill="#0B0D10">An open-source Persian design system.</text>
<text x="56" y="180" class="sans" font-size="16" fill="#5B6472">RTL-first, dark-first and accessible — React, Web Components,</text>
<text x="56" y="202" class="sans" font-size="16" fill="#5B6472">tokens, a Figma kit and an MCP server for AI assistants.</text>
